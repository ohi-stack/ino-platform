name: INO PHP lint
on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'release/**']
  pull_request:
    branches: [main, 'fix/**', 'release/**']
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP sources
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify UI assets and fail-closed privacy guards
        run: |
          set -euo pipefail
          test -s assets/css/ino-admin-command.css
          test -s assets/css/ino-public-platform.css
          test -s assets/js/ino-admin-command.js
          grep -Fq 'data-ino-series' includes/class-ino-platform-admin.php
          grep -Fq 'm.public_consent=1' includes/class-ino-platform-shortcodes.php
          grep -Fq 'MAX(id) AS latest_id' includes/class-ino-platform-shortcodes.php
          grep -Fq "status='approved'" includes/class-ino-platform-shortcodes.php
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-admin-command.css
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-public-platform.css

      - name: Verify governance foundation contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-governance.php
          test -s assets/css/ino-governance-foundation.css
          test -s docs/governance-phase1-foundation.md
          grep -Fq "ino_governance_review" includes/class-ino-platform-governance.php
          grep -Fq "ino_governance_publish" includes/class-ino-platform-governance.php
          grep -Fq "ino_governance_schema_version" includes/class-ino-platform-governance.php
          grep -Fq "ino_governance_audit" includes/class-ino-platform-governance.php
          grep -Fq "ino_governance_structure" includes/class-ino-platform-governance.php
          grep -Fq "current_user_can('ino_governance_publish')" includes/class-ino-platform-governance.php
          grep -Fq "check_admin_referer" includes/class-ino-platform-governance.php
          grep -Fq "START TRANSACTION" includes/class-ino-platform-governance.php
          grep -Fq "document_hash" includes/class-ino-platform-governance.php
          grep -Fq "prefers-reduced-motion:reduce" assets/css/ino-governance-foundation.css

      - name: Verify operational governance source contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-governance-operations.php
          test -s includes/class-ino-governance-operations-ui.php
          test -s assets/css/ino-governance-operations.css
          test -s docs/governance-phase2-operations.md
          grep -Fq 'ino_gov_ops_schema_version' includes/class-ino-governance-operations.php
          grep -Fq 'ino_gov_minute_versions' includes/class-ino-governance-operations.php
          grep -Fq 'ino_gov_resolutions' includes/class-ino-governance-operations.php
          grep -Fq 'ino_gov_notifications' includes/class-ino-governance-operations.php
          grep -Fq 'ino_gov_ops_events' includes/class-ino-governance-operations.php
          grep -Fq 'check_admin_referer' includes/class-ino-governance-operations.php
          grep -Fq "current_user_can('ino_governance_publish')" includes/class-ino-governance-operations-ui.php
          grep -Fq 'outcome_recorded' includes/class-ino-governance-operations.php
          grep -Fq 'decision_attestation' includes/class-ino-governance-operations.php
          grep -Fq 'read_notice' includes/class-ino-governance-operations.php
          grep -Fq 'START TRANSACTION' includes/class-ino-governance-operations.php
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-governance-operations.css
          # Release versions are asserted in the most recent phase's contract,
          # rather than requiring the old Phase 2 version on later release candidates.


      - name: Verify ODIN Phase 3 privacy and provenance contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-governance-odin.php
          test -s includes/class-ino-governance-odin-ui.php
          test -s assets/css/ino-governance-odin.css
          test -s docs/governance-phase3-odin-transparency.md
          grep -Fq "ino_odin_schema_version" includes/class-ino-governance-odin.php
          grep -Fq "ino_odin_versions" includes/class-ino-governance-odin.php
          grep -Fq "ino_odin_signature_evidence" includes/class-ino-governance-odin.php
          grep -Fq "ino_odin_events" includes/class-ino-governance-odin.php
          grep -Fq "ino_governance_review" includes/class-ino-governance-odin.php
          grep -Fq "ino_governance_publish" includes/class-ino-governance-odin.php
          grep -Fq "check_admin_referer" includes/class-ino-governance-odin.php
          grep -Fq "hash_equals" includes/class-ino-governance-odin.php
          grep -Fq "START TRANSACTION" includes/class-ino-governance-odin.php
          grep -Fq "AND g.visibility='public'" includes/class-ino-governance-odin.php
          grep -Fq "g.status='published'" includes/class-ino-governance-odin.php
          grep -Fq "ino_odin_verify" includes/class-ino-governance-odin.php
          grep -Fq "prefers-reduced-motion:reduce" assets/css/ino-governance-odin.css
          # Version pinned in the current release gate, not the older Phase 3 contract.

      - name: Verify release and member UI activation boundaries
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-release.php
          grep -Fq "INO_PLATFORM_PRODUCTION_APPROVED" includes/class-ino-platform-release.php
          grep -Fq "ino-platform-suite/ino-platform-suite.php" includes/class-ino-platform-release.php
          grep -Fq "ino_platform_schema_version" includes/class-ino-platform-release.php
          grep -Fq "ino_member_dashboard" includes/class-ino-platform-shortcodes.php
          grep -Fq "ino-member-dashboard" includes/class-ino-platform-activator.php
          grep -Fq "Version: 1.6.4-rc.1" ino-platform.php
          grep -Fq "define('INO_PLATFORM_VERSION', '1.6.4-rc.1')" ino-platform.php

      - name: Verify BuddyPress Bridge integration contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-buddypress.php
          test -s assets/css/ino-buddypress-admin.css
          test -s tests/integration/buddypress-smoke.php
          grep -Fq "ino-platform-buddypress" includes/class-ino-platform-admin.php
          grep -Fq "INO_Platform_BuddyPress::page()" includes/class-ino-platform-admin.php
          grep -Fq "INO_Platform_BuddyPress::can_connect_target" includes/class-ino-platform-social.php
          grep -Fq "public_consent=1" includes/class-ino-platform-buddypress.php
          grep -Fq "check_admin_referer" includes/class-ino-platform-buddypress.php
          grep -Fq "ino_bp_bridge_audit" includes/class-ino-platform-buddypress.php
          grep -Fq "prefers-reduced-motion:reduce" assets/css/ino-buddypress-admin.css

      - name: Verify INO Voting module contract
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-voting.php
          test -s assets/css/ino-voting.css
          test -s tests/voting/run.sh
          grep -Fq 'ino_votes_ballots' includes/class-ino-platform-voting.php
          grep -Fq 'UNIQUE KEY one_ballot' includes/class-ino-platform-voting.php
          grep -Fq 'check_admin_referer' includes/class-ino-platform-voting.php
          grep -Fq 'FOR UPDATE' includes/class-ino-platform-voting.php
          grep -Fq 'START TRANSACTION' includes/class-ino-platform-voting.php
          grep -Fq 'ino_voting' includes/class-ino-platform-voting.php
          grep -Fq 'results_policy' includes/class-ino-platform-voting.php
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-voting.css
          grep -Fq "Version: 1.6.4-rc.1" ino-platform.php

      - name: Verify private-first genealogy contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-genealogy.php
          test -s assets/css/ino-genealogy.css
          test -s docs/genealogy-workspace-1.6.2.md
          grep -Fq "INO_Platform_Genealogy::init()" ino-platform.php
          grep -Fq "INO_Platform_Genealogy::install()" includes/class-ino-platform-release.php
          grep -Fq "wp_verify_nonce" includes/class-ino-platform-genealogy.php
          grep -Fq "owner_id=%d" includes/class-ino-platform-genealogy.php
          grep -Fq "life_status === 'deceased'" includes/class-ino-platform-genealogy.php
          grep -Fq "visibility === 'public'" includes/class-ino-platform-genealogy.php
          grep -Fq "public_consent=1" includes/class-ino-platform-buddypress.php

      - name: Verify INO Documents registry and public disclosure guards
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-documents.php
          test -s assets/css/ino-documents-admin.css
          test -s docs/documents-registry-1.6.3.md
          grep -Fq "INO_Platform_Documents::init()" ino-platform.php
          grep -Fq "INO_Platform_Documents::install()" includes/class-ino-platform-release.php
          grep -Fq "INO_Platform_Documents::page()" includes/class-ino-platform-admin.php
          grep -Fq "check_admin_referer" includes/class-ino-platform-documents.php
          grep -Fq "ino_documents_access" includes/class-ino-platform-documents.php
          grep -Fq "created_by" includes/class-ino-platform-documents.php
          grep -Fq "reviewed_by" includes/class-ino-platform-documents.php
          grep -Fq "confidentiality=%s" includes/class-ino-platform-documents.php
          grep -Fq "LOWER(status)=%s" includes/class-ino-platform-documents.php
          grep -Fq "ino_document_events" includes/class-ino-platform-documents.php
          grep -Fq "fputcsv" includes/class-ino-platform-documents.php
          grep -Fq "prefers-reduced-motion:reduce" assets/css/ino-documents-admin.css

      - name: Verify Declarations and Affidavits source and privacy contracts
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-declarations.php
          test -s assets/css/ino-declarations.css
          test -s docs/declarations-affidavits-1.6.4.md
          grep -Fq "INO_Platform_Declarations::init()" ino-platform.php
          grep -Fq "INO_Platform_Declarations::install()" includes/class-ino-platform-release.php
          grep -Fq "ino_declarations_affidavits" includes/class-ino-platform-declarations.php
          grep -Fq "get_page_by_path('documents/affidavits-and-declarations'" includes/class-ino-platform-declarations.php
          grep -Fq "public_listing=1" includes/class-ino-platform-declarations.php
          grep -Fq "confidentiality=%s" includes/class-ino-platform-declarations.php
          grep -Fq "oath_reference<>''" includes/class-ino-platform-declarations.php
          grep -Fq "public_listing TINYINT(1)" includes/class-ino-platform-documents.php
          grep -Fq "created_by" includes/class-ino-platform-documents.php
          grep -Fq "reviewed_by" includes/class-ino-platform-documents.php
          grep -Fq "prefers-reduced-motion:reduce" assets/css/ino-declarations.css

      - name: Verify INO Membership Portal presentation and privacy contract
        run: |
          set -euo pipefail
          test -s includes/class-ino-platform-membership-ui.php
          test -s assets/css/ino-membership-ui.css
          test -s assets/js/ino-membership-ui.js
          test -s tests/integration/membership-ui-smoke.php
          grep -Fq "INO_Platform_Membership_UI::admin_page()" includes/class-ino-platform-admin.php
          grep -Fq "INO_Platform_Membership_UI::member_dashboard()" includes/class-ino-platform-shortcodes.php
          grep -Fq 'WHERE user_id=%d' includes/class-ino-platform-membership-ui.php
          grep -Fq 'View the source data table' includes/class-ino-platform-membership-ui.php
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-membership-ui.css
          grep -Fq "Version: 1.6.4-rc.1" ino-platform.php
