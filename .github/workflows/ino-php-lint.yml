name: INO PHP lint
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP sources
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify UI assets and fail-closed privacy guards
        run: |
          set -euo pipefail
          test -s assets/css/ino-admin-command.css
          test -s assets/css/ino-public-platform.css
          test -s assets/js/ino-admin-command.js
          grep -Fq 'data-ino-series' includes/class-ino-platform-admin.php
          grep -Fq 'public_consent = 1' includes/class-ino-platform-shortcodes.php
          grep -Fq "status='approved'" includes/class-ino-platform-shortcodes.php
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-admin-command.css
          grep -Fq 'prefers-reduced-motion:reduce' assets/css/ino-public-platform.css
