name: INO PHP lint
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP sources
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
