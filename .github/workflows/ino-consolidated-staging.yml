name: INO Consolidated Staging Candidate
on:
  push:
    branches:
      - feat/ino-wp-staging-workflow-20261010-consolidated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint all plugin and test PHP
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Verify authoritative plugin entry point and staging version
        run: |
          set -euo pipefail
          test -s ino-platform.php
          test -s includes/class-ino-governance-odin.php
          grep -Fq 'Version: 1.5.0-rc.1' ino-platform.php
          grep -Fq "define('INO_PLATFORM_VERSION', '1.5.0-rc.1')" ino-platform.php

  wordpress-integration:
    name: Real disposable WordPress + MariaDB acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: ino_stage_db
          MARIADB_USER: ino_stage
          MARIADB_PASSWORD: ino_stage_test_pw
          MARIADB_ROOT_PASSWORD: isolated_test_root_pw
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      WP_ROOT: /tmp/ino-wp-isolated-staging
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, dom, zip, json
          coverage: none
      - name: Install WP-CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          sudo install -m 0755 /tmp/wp-cli.phar /usr/local/bin/wp
      - name: Install real WordPress on isolated MariaDB
        run: |
          set -euo pipefail
          mkdir -p "$WP_ROOT"
          wp core download --path="$WP_ROOT" --quiet
          wp config create --path="$WP_ROOT" --dbname=ino_stage_db --dbuser=ino_stage \
            --dbpass=ino_stage_test_pw --dbhost=127.0.0.1:3306 --quiet
          wp core install --path="$WP_ROOT" --url=http://localhost:8081 \
            --title="INO isolated release test" --admin_user=admin_test \
            --admin_password=synthetic-ci-only-password --admin_email=admin@example.invalid --quiet
          mkdir -p "$WP_ROOT/wp-content/plugins/ino-platform"
          rsync -a --exclude .git --exclude .github --exclude tests --exclude scripts \
            --exclude release ./ "$WP_ROOT/wp-content/plugins/ino-platform/"
          wp plugin activate ino-platform --path="$WP_ROOT" --quiet
          wp plugin status ino-platform --path="$WP_ROOT"
      - name: Test governance workflow, authorization denials and rollback
        run: bash tests/staging/run.sh
      - name: Publish audit-safe synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ino-consolidated-integration-${{ github.run_id }}
          path: staging-governance-results.txt
          if-no-files-found: ignore

  build-staging-zip:
    name: Create installable staging ZIP and SHA256 manifest
    runs-on: ubuntu-latest
    needs: [php-lint, wordpress-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build deterministic-scope WordPress plugin package
        run: bash scripts/build-ino-staging.sh
      - name: Verify archive before release
        run: |
          set -euo pipefail
          cd release/dist
          unzip -t INO-Platform-Plugin-*.zip
          sha256sum -c SHA256SUMS
          unzip -p INO-Platform-Plugin-*.zip ino-platform/ino-platform.php | grep -F 'Version: 1.5.0-rc.1'
      - name: Upload staging candidate — not for production
        uses: actions/upload-artifact@v4
        with:
          name: INO-Platform-1.5.0-rc1-STAGING-${{ github.sha }}
          path: |
            release/dist/*.zip
            release/dist/SHA256SUMS
            release/dist/RELEASE-MANIFEST.txt
            release/dist/zip-integrity.txt
          retention-days: 30
          if-no-files-found: error
